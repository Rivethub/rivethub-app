# Builds the Linux desktop app (AppImage + .deb) on x64 and arm64 and smoke-tests both packages.
# A dispatched run also uploads them, with electron-builder's latest-linux*.yml update manifests,
# as workflow artifacts; a pull request's build is checked and not kept. The publish job copies
# the artifacts to get.rivethub.io/desktop/<channel>/, where installed apps look for updates; it
# runs only when dispatched on main with publish=true.
#
# Builds are nightly-versioned, x.y.z-nightly.YYYYMMDD.<run>, from apps/desktop/package.json's x.y.z,
# unless dispatched with channel=stable, which builds x.y.z itself. Stable is for a release that a
# fresh install can set up and run (capture and search) with as close to one click as we can get.
# Nightlies are published by hand (dispatch with publish=true); there is no schedule.
# After a stable x.y.z ships, bump package.json to the next x.y.z: x.y.z-nightly sorts below x.y.z,
# and the publish job refuses a nightly that isn't newer than the live stable release.
name: Release desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the packages and update manifests to get.rivethub.io/desktop
        type: boolean
        default: false
      channel:
        description: nightly (default) or stable. Stable builds the plain package.json version.
        type: choice
        options: [nightly, stable]
        default: nightly
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release-desktop.yml"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One version for both arches, so they can't straddle midnight UTC.
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      - id: pick
        env:
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'nightly' }}
        run: |
          set -euo pipefail
          base=$(node -p 'require("./apps/desktop/package.json").version')
          if [[ "${CHANNEL}" == stable ]]; then version="${base}"; else version="${base}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"; fi
          echo "Building ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  linux:
    name: linux-${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Electron, electron-builder tools and rh
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/rivethub/rh
          key: desktop-linux-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/rh.lock.json') }}
          restore-keys: desktop-linux-${{ matrix.arch }}-
      - run: pnpm install --frozen-lockfile --filter "@rivethub/desktop..."
      - name: Build AppImage and .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: pnpm dist:desktop:linux --arch ${{ matrix.arch }} --output-dir release --version "${VERSION}"

      # The AppImage must ship our AppRun, which refuses to start rather than add --no-sandbox.
      - name: Check the AppImage's AppRun
        run: RIVETHUB_APPIMAGE="$(ls "$PWD"/release/*.AppImage)" pnpm --filter @rivethub/desktop exec vitest run scripts/appimage-apprun.test.ts

      # A build can package fine and still not open. This launches the app from each package, with
      # Chromium's sandbox on: ubuntu-22.04 runners allow unprivileged user namespaces. On a runner
      # that didn't, the smoke would pass --no-sandbox to the .deb's unpacked binary only, and the
      # AppImage check would fail, because its AppRun refuses to start there.
      - name: Launch check
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a -s '-screen 0 1920x1080x24' pnpm smoke:desktop --executable "$(ls release/*.AppImage)" --artifacts-dir "$RUNNER_TEMP/desktop-launch-check/appimage"
          xvfb-run -a -s '-screen 0 1920x1080x24' pnpm smoke:desktop --executable "$(ls release/*.deb)" --artifacts-dir "$RUNNER_TEMP/desktop-launch-check/deb"

      # The desktop e2e suite (window, navigation, IPC, and updates against a local https mock feed)
      # on the dev build that the package step just built.
      - name: End-to-end tests
        run: xvfb-run -a -s '-screen 0 1920x1080x24' pnpm --filter @rivethub/desktop exec playwright test

      # Packages a nightly-versioned AppImage + .deb again and checks electron-builder names the
      # manifest latest-linux*.yml and leaves app-update.yml without a channel.
      - name: Check a nightly build's update files
        run: RIVETHUB_PACKAGE_CHECK=1 pnpm --filter @rivethub/desktop exec vitest run scripts/update-manifest.test.ts

      - name: Upload launch check output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-launch-check-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore
          retention-days: 7

      # Only a dispatched run can publish, so only a dispatched run keeps its packages, and only for
      # a week. A pull request's build is checked by the steps above and then thrown away: at about
      # 500 MB a run, keeping them filled the account's artifact storage, after which every build
      # failed at this step with all of its checks passed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: rivethub-desktop-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Copies both arches' packages and latest-linux*.yml to the channel's directory on the
  # get.rivethub.io host, the way Rivethub/rivethub-io's ci.yml deploys: rsync over SSH as rivet@
  # from the self-hosted deploy runner. The channel comes from the version: x.y.z-nightly.YYYYMMDD.N
  # goes to nightly, anything else to stable.
  #
  # Setup (done 2026-11-12): the `rivethub-app` runner on the deploy box carries the rivethub-io
  # label; the `desktop-publish` environment, limited to main, holds DEPLOY_SSH_KEY, a key whose
  # authorized_keys entry is command="rrsync -wo /var/www/get.rivethub.io/desktop",restrict;
  # repo variables DEPLOY_KNOWN_HOSTS (pinned host key) and DESKTOP_PUBLISH_ENABLED=true.
  publish:
    name: Publish to get.rivethub.io
    needs: [version, linux]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish && vars.DESKTOP_PUBLISH_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, rivethub-io]
    # The environment releases the deploy key only to runs on main, so a PR's workflow edit can't use it.
    environment: desktop-publish
    timeout-minutes: 15
    concurrency:
      group: publish-desktop
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 100.120.143.117
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rivethub-desktop-linux-*
          path: dist
          merge-multiple: true

      - name: Pick the channel
        env:
          WANT_VERSION: ${{ needs.version.outputs.version }}
          WANT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/latest-linux.yml && test -f dist/latest-linux-arm64.yml
          version=$(sed -n 's/^version: //p' dist/latest-linux.yml)
          test "${version}" = "$(sed -n 's/^version: //p' dist/latest-linux-arm64.yml)"
          # Same rule as updateChannelFor in apps/desktop/src/updates/updateFeed.ts. A version that mentions
          # nightly but doesn't match it would land in nightly/ while the app reads it as stable.
          if [[ "${version}" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            channel=nightly
          elif [[ "${version}" == *nightly* ]]; then
            echo "::error::${version} is not x.y.z-nightly.YYYYMMDD.N, so the app would not treat it as nightly"
            exit 1
          else
            channel=stable
          fi
          test "${version}" = "${WANT_VERSION}"
          test "${channel}" = "${WANT_CHANNEL}"
          echo "Publishing ${version} to ${channel}"
          echo "CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Clients update only to a strictly higher version, so republishing the same version would
      # overwrite its packages for nobody's benefit (and break downloads mid-upload), and a nightly
      # at or below the live stable would never reach anyone on stable who switches to nightly.
      # Requires the new version to be above the live one on its channel, and a nightly to be
      # above the live stable too.
      - name: Check the version is newer than what's live
        run: |
          set -euo pipefail
          # Sort key for the two shapes we publish: x.y.z (stable) and x.y.z-nightly.YYYYMMDD.N,
          # ordered as semver orders them (a prerelease sorts below its x.y.z).
          key() {
            if [[ "$1" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-nightly\.([0-9]{8})\.([0-9]+))?$ ]]; then
              if [[ -n "${BASH_REMATCH[4]}" ]]; then
                printf '%d %d %d 0 %d %d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" "${BASH_REMATCH[5]}" "${BASH_REMATCH[6]}"
              else
                printf '%d %d %d 1 0 0\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
              fi
            else
              echo "::error::${1} is neither x.y.z nor x.y.z-nightly.YYYYMMDD.N" >&2
              return 1
            fi
          }
          newer() { # $1 > $2
            local a b
            a=$(key "$1") || exit 1
            b=$(key "$2") || exit 1
            [[ "${a}" != "${b}" && "$(printf '%s\n%s\n' "${a}" "${b}" | sort -k1,1n -k2,2n -k3,3n -k4,4n -k5,5n -k6,6n | tail -1)" == "${a}" ]]
          }
          live() { # prints the live version on channel $1, or nothing if it has none yet
            local body status
            body=$(mktemp)
            status=$(curl -sS -o "${body}" -w '%{http_code}' "https://get.rivethub.io/desktop/$1/latest-linux.yml")
            case "${status}" in
              200) sed -n 's/^version: //p' "${body}" ;;
              404) ;;
              *) echo "::error::GET $1/latest-linux.yml returned ${status}" >&2; return 1 ;;
            esac
          }
          channels=("${CHANNEL}")
          [[ "${CHANNEL}" == nightly ]] && channels+=(stable)
          for c in "${channels[@]}"; do
            current=$(live "${c}")
            if [[ -n "${current}" ]] && ! newer "${VERSION}" "${current}"; then
              echo "::error::${VERSION} is not newer than live ${c} ${current}; bump apps/desktop/package.json"
              exit 1
            fi
            echo "live ${c}: ${current:-none}"
          done

      # The host key is pinned in a repo variable, not trusted on first use.
      - name: Configure deploy SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "${DEPLOY_SSH_KEY}" || { echo "::error::DEPLOY_SSH_KEY is not set in the desktop-publish environment"; exit 1; }
          test -n "${DEPLOY_KNOWN_HOSTS}" || { echo "::error::DEPLOY_KNOWN_HOSTS repository variable is not set"; exit 1; }
          KEY="${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${KEY}"
          chmod 600 "${KEY}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${RUNNER_TEMP}/known_hosts"
          echo "SSH_CMD=ssh -i ${KEY} -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      # Packages first, manifests last, so a client never reads a manifest whose files aren't there
      # yet. No --delete: older packages stay for rollback. The key's rrsync forced command roots
      # these paths at /var/www/get.rivethub.io/desktop, and the channel directory must already exist.
      - name: Upload
        run: |
          set -euo pipefail
          rsync -z --chmod=F644 -e "${SSH_CMD}" dist/*.AppImage dist/*.deb rivet@"${DEPLOY_HOST}":"${CHANNEL}/"
          rsync -z --chmod=F644 -e "${SSH_CMD}" dist/latest-linux.yml dist/latest-linux-arm64.yml rivet@"${DEPLOY_HOST}":"${CHANNEL}/"

      - name: Verify
        run: |
          set -euo pipefail
          for manifest in latest-linux.yml latest-linux-arm64.yml; do
            curl -fsS "https://get.rivethub.io/desktop/${CHANNEL}/${manifest}" | cmp -s - "dist/${manifest}" \
              || { echo "::error::live ${CHANNEL}/${manifest} does not match this build"; exit 1; }
          done

      - name: Remove deploy key
        if: always()
        run: rm -f "${RUNNER_TEMP}/deploy_key"
