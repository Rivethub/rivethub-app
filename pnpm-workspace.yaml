packages:
  - apps/*
  - packages/*
  - integrations/*

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  electron: true
  # electron-builder's Windows installer helper; Linux packaging never runs it.
  electron-winstaller: false

overrides:
  "@jest/reporters>glob": 14.0.6
  "jest-config>glob": 14.0.6
  "jest-runtime>glob": 14.0.6
  "test-exclude@7>glob": 14.0.6
  "test-exclude@7>minimatch": 11.0.9
  "@expo/fingerprint>minimatch": 11.0.9
  "@electron/universal@2>minimatch": 11.0.9
  "app-builder-lib>minimatch": 11.0.9
